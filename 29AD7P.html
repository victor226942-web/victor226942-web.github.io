<!doctype html><html lang=pt-BR><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Wi-Fi</title><link rel=stylesheet href='https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap'><style>body{margin:0;background:linear-gradient(180deg,#eef2ff 0,#f5f6f8 260px);min-height:100vh;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#0f172a;-webkit-font-smoothing:antialiased}main{max-width:460px;margin:0 auto;padding:2.2rem 16px 3rem}h1{text-align:center;margin:.3rem 0 1.6rem;font-size:1.7rem;letter-spacing:-.02em}h2{margin:0 0 .5rem;font-size:1.1rem}.box{background:#fff;border-radius:18px;padding:1.1rem 1.2rem;margin:0 0 1rem;box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.06)}.box p{margin:.4rem 0;overflow-wrap:anywhere}.center{text-align:center}.icon{font-size:2.4rem;margin:.3rem 0}.b{display:block;box-sizing:border-box;width:100%;padding:1rem;margin:.6rem 0;border:0;border-radius:14px;color:#fff;font:inherit;font-size:1.05rem;font-weight:600;text-align:center;text-decoration:none;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.12);transition:transform .1s}.b:active{transform:scale(.98)}.b.light{background:#eef0f3;color:#0f172a;box-shadow:none}.hint{font-size:.85rem;color:#64748b}textarea{position:absolute;left:-9999px}footer{text-align:center;font-size:.75rem;color:#94a3b8;margin-top:2rem}</style><main><h1>Wi-Fi</h1><div class=box><h2>Wi-Fi</h2><p>Rede: <b>Vale-Internet-Guest</b></p><p>Senha: <b>*Sejabemvindo*</b></p><textarea id=wifipass readonly>*Sejabemvindo*</textarea><button class=b style='background:#4b5563' onclick="copy('wifipass',this)">Copiar senha do Wi-Fi</button><p class=hint>Abra <b>Ajustes &gt; Wi-Fi</b> no celular, escolha a rede e cole a senha.</p></div></main><script>function copy(id,b){var t=document.getElementById(id);t.select();t.setSelectionRange(0,99999);var ok=false;try{ok=document.execCommand('copy')}catch(e){}if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value);ok=true}var old=b.textContent;b.textContent=ok?'Copiado!':'Selecione e copie manualmente';setTimeout(function(){b.textContent=old},2000)}</script>
